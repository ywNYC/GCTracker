name: Auto-update Visa Bulletin

# 抓取窗口与节奏（2026-08-26 按业主要求重设，起因见下面「九月事故」）：
#   每月 13 号到月底，每天 5 次，24 小时均匀铺开（UTC 1/6/11/16/21 ≈ 美东 21/02/07/12/17 点），
#   周六周日照跑。历史上公报的真实上线日在上月 12-23 号之间波动，所以窗口开到月底兜底。
#
# 九月事故（2026-08-22 至 24）——这套节奏就是为了修它：
#   旧配置是「工作日每天 4 次、窗口 10-23 号」。九月公报落在 8/22-8/23 那个周末，
#   周末闸把抓取整段跳过（连通知步骤都在被跳过的 job 里，所以一封邮件都没发）；
#   本该兜底的周一 8/24 又因为窗口 23 号就关了，一次都没跑。业主最后是自己用浏览器
#   手动抓的，网站晚了约三天。两个毛病叠加，缺一都不会出事。
#
# 不要用公告自己的 "CA/VO: <date>" 那行来定时间。那是签证办公室内部签发日（每月 1-5 号左右），
# 当成上线日会算出一个永远错过发布的窗口。九月那期印的是 August 10，实际上线在 8/22 之后。
#
# GitHub Actions 的 cron 在同时限制「日」和「星期」时是 OR 语义（任一匹配就跑），
# 所以星期永远不写进 cron 字段——现在也不需要了，周末本来就要跑。
on:
  schedule:
    - cron: '0 1,6,11,16,21 13-31 * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed the current month instead of fetching next month'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: scrape-bulletin
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20+ required: the scraper uses the built-in global fetch and has no deps.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 退出码：0 = 正常（写了新数据，或本来就是最新，或目标月份还没发布 404）；
      #        1 = 瞬时故障（网络/所有 host 都失败），下一档自动重试；
      #        2 = 解析器真的坏了，要人工修。
      # continue-on-error 是为了让下面的通知步骤能按退出码分档处理，
      # 最后一步 Fail the job 再把非 0 的退出码还原成 job 失败。
      - name: Scrape bulletin
        id: scrape
        continue-on-error: true
        run: |
          set +e
          if [ "${{ inputs.seed }}" = "true" ]; then
            node scripts/scrape-bulletin.mjs --seed
          else
            node scripts/scrape-bulletin.mjs
          fi
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE

      # USCIS 的表格判定一般比国务院公告晚约一周，所以跟着同一节奏跑。
      # 尽力而为：USCIS 挂了不能把公告抓取带成红色（`|| true`）。
      - name: Scrape USCIS chart designation
        run: node scripts/scrape-uscis-chart.mjs || true

      - name: Append current month to history.json
        run: node scripts/append-current-to-history.mjs

      # 抓到新公告 → 立刻提交 → Cloudflare Pages 自动重新部署。
      # 这一步不等任何人批准，业主明确要求「哪怕我在睡觉也直接更新网页」。
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/bulletin.json public/uscis-charts.json public/history.json; then
            echo "No change to scraped data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bulletin.json public/uscis-charts.json public/history.json
          git commit -m "chore: auto-update visa bulletin"
          git push
          echo "Pushed updated bulletin — Cloudflare Pages will redeploy."
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloudflare Pages redeploy
        id: wait_deploy
        if: steps.commit.outputs.committed == 'true'
        run: |
          WANT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/history.json','utf8')).latest)")
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "https://gc.jmjvc.us/history.json" 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(d).latest||'')}catch{}})" || echo "")
            if [ "$LIVE" = "$WANT" ]; then
              echo "Live site now serving $WANT (attempt $i)."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for Pages redeploy... live=$LIVE want=$WANT (attempt $i/30)"
            sleep 10
          done
          echo "::warning::Timed out waiting for Cloudflare Pages redeploy after 5 minutes."

      # 订阅者邮件不再自动发。业主要求邮件由他本人批准后再发（网页可以自动更新，邮件不行）。
      # 这里只做 dryRun：算出「如果发，会发给多少人」，写进通知 issue 供他决定。
      - name: Preview subscriber email (dry run — sends nothing)
        id: dryrun
        if: steps.commit.outputs.committed == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "count=(ADMIN_TOKEN 未配置，没算成)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "https://gc.jmjvc.us/api/admin/send-monthly?dryRun=1" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o dryrun.json || echo '{}' > dryrun.json
          COUNT=$(node -e "try{const r=JSON.parse(require('fs').readFileSync('dryrun.json','utf8'));console.log(Array.isArray(r.sent)?r.sent.length:'?')}catch{console.log('?')}")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Build 小红书 post copy
        if: steps.commit.outputs.committed == 'true'
        run: node scripts/build-xhs-post.mjs > xhs-post.txt

      # 抓到了：立刻开 issue（GitHub 自己会发邮件，等于第一时间通知业主），
      # 正文里直接带上可复制的小红书文案和邮件批准入口。
      - name: Notify owner — new bulletin captured
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/bulletin.json','utf8')).current.month)")
          {
            echo "$MONTH 公告已经抓到，网站已自动更新上线（不需要你做任何事）。"
            echo ""
            echo "**订阅者邮件还没发** —— 按你的要求，邮件要你批准。dryRun 显示这次会发给 ${{ steps.dryrun.outputs.count }} 个订阅者。"
            echo "要发的话：Actions → \"Send monthly subscriber email\" → Run workflow → 月份填 $MONTH。"
            echo ""
            echo "---"
            echo ""
            echo "### 小红书文案（可直接复制）"
            echo ""
            echo '```'
            cat xhs-post.txt
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "还需要人工做的："
            echo "- [ ] 批准并发送订阅者邮件"
            echo "- [ ] 发小红书"
            echo "- [ ] 核对 USCIS 采用哪张表（uscis-charts.json 一般晚约一周）"
            echo "- [ ] 翻译公告 D 节以后的 notices 进 notice-translations.json"
            echo "- [ ] 站内一致性检查（个人页／最新页／邮件预览）"
          } > issue-body.md
          gh issue create --title "🎉 新排期公告已上线：$MONTH（网页已更新，邮件待你批准）" --assignee ywNYC --body-file issue-body.md

      # 解析器坏了（exit 2）是真事故，每次都立刻报，不等日报。
      - name: Notify owner — parser broken
        if: steps.commit.outputs.committed != 'true' && steps.scrape.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ 排期抓取解析失败（需要人工修）" --assignee ywNYC \
            --body "scrape-bulletin.mjs 退出码 2 —— 页面抓到了但解析不出四张表，通常是国务院改了页面结构。日志见本次 workflow run。这类错误不会自动恢复，要人工修解析器。"

      # 没抓到新公告时，一天只报一次（业主明确要求：不要每次都发）。
      # 判定「今天最后一档」用当天已跑次数（>=5），不用固定小时——GitHub 的 cron 经常延迟十几分钟，
      # 按小时判会漏。再加一道「今天是否已发过日报」的去重，防止手动 dispatch 把次数顶上去后重复发。
      - name: Daily digest — nothing new today
        if: steps.commit.outputs.committed != 'true' && steps.scrape.outputs.code != '2' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # 本月已经抓到目标月份的公告了，就不用再发日报了。
          ALREADY=$(node -e "
            const b=JSON.parse(require('fs').readFileSync('public/bulletin.json','utf8'));
            const n=new Date();
            const t=new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth()+1, 1));
            const key=t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0');
            console.log(b.current.month===key?'yes':'no');
          ")
          if [ "$ALREADY" = "yes" ]; then
            echo "下期公告已经在库里了，本月不再发日报。"
            exit 0
          fi
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/scrape-bulletin.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")
          if [ "$RUNS" -lt 5 ]; then
            echo "今天第 $RUNS 档，还没到最后一档，不发日报。"
            exit 0
          fi
          DUP=$(gh issue list --state all --search "日报 $TODAY in:title" --json number --jq 'length')
          if [ "$DUP" != "0" ]; then
            echo "今天的日报已经发过了，跳过。"
            exit 0
          fi
          if [ "${{ steps.scrape.outputs.code }}" = "1" ]; then
            NOTE="注意：今天最后一档抓取遇到网络类瞬时失败（退出码 1），下一档会自动重试。"
          else
            NOTE="今天各档都正常完成，只是国务院还没放出下一期。"
          fi
          BODY=$(printf '%s\n\n抓到的第一时间会单独开一条 issue（标题带 🎉），并且网页会自动更新，不用等这条日报。' "$NOTE")
          gh issue create --title "日报 $TODAY：今天查了 $RUNS 次，暂无新公告" --assignee ywNYC --body "$BODY"

      - name: Summary
        if: always()
        run: |
          echo "### Visa bulletin scrape" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: ${{ steps.scrape.outputs.code }} (0 = ok / not published yet, 1 = transient, 2 = parser broke)" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed: ${{ steps.commit.outputs.committed || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

      # 通知发完之后再把 job 标红，这样 GitHub 自带的「scheduled workflow failed」邮件也会到。
      - name: Fail the job if the scrape failed
        if: steps.scrape.outputs.code != '0'
        run: exit 1
