name: Auto-update Visa Bulletin

# Actual publication dates, from the Wayback Machine's earliest successful capture of
# each bulletin page (day of the PRIOR month):
#   Sep→13 · Oct→12 · Nov→15 · Dec→14 · Jan→18 · Feb→12 · Mar→19 · Apr→17 · May→22 · Jul→18
# Observed range is days 12-22, so days 10-23 covers it with margin on both sides. Note
# the original '8-21' window would have missed the May bulletin, published on day 22.
#
# Do NOT use the bulletin's own "CA/VO: <date>" line to time this. That is an internal
# Visa Office sign-off date, roughly the 1st-5th, and reading it as the publication date
# produces a window that misses every release.
#
# Twice daily so a bulletin is picked up within ~12h. 13:00/20:00 UTC = 09:00/16:00 ET.
on:
  schedule:
    - cron: '0 13,20 10-23 * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed the current month instead of fetching next month'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-bulletin
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20+ required: the scraper uses the built-in global fetch and has no deps.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scrape bulletin
        id: scrape
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            node scripts/scrape-bulletin.mjs --seed
          else
            node scripts/scrape-bulletin.mjs
          fi

      # USCIS posts its chart designation ~a week after the DOS bulletin, so this
      # runs on the same daily cadence. Best-effort: a USCIS outage must not turn
      # the bulletin scrape red (`|| true`); the parser's own exit 2 still shows
      # in the log for humans.
      - name: Scrape USCIS chart designation
        run: node scripts/scrape-uscis-chart.mjs || true

      # The scrapers write into public/ — Vite serves public/ at the site root,
      # so these become /bulletin.json and /uscis-charts.json after a Pages build.
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/bulletin.json public/uscis-charts.json; then
            echo "No change to scraped data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bulletin.json public/uscis-charts.json
          git commit -m "chore: auto-update visa bulletin"
          git push
          echo "Pushed updated bulletin — Cloudflare Pages will redeploy."

      - name: Summary
        if: always()
        run: |
          echo "### Visa bulletin scrape" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.scrape.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit codes: 0 = ok (data written or already current), 1 = transient (network / all hosts failed, retries tomorrow), 2 = parser broke (needs a human)." >> "$GITHUB_STEP_SUMMARY"
