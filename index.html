    <title>绿卡晴雨表 · Green Card Tracker — 绿卡排期追踪与预测</title>

  <body>
    <div id="root"></div>
    <script>
      // Privacy-light dwell beacon (no cookies, no IP, random self-minted ids).
      // Tracks visible time only; /api/beacon overwrites one KV record per session,
      // so the last ping carries the session's cumulative total.
      (function () {
        try {
          var mk = function () {
            return (window.crypto && crypto.randomUUID)
              ? crypto.randomUUID()
              : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
          };
          var vid = localStorage.getItem('gc_vid');
          if (!vid) { vid = mk(); localStorage.setItem('gc_vid', vid); }
          var sid = sessionStorage.getItem('gc_sid');
          if (!sid) { sid = mk(); sessionStorage.setItem('gc_sid', sid); }
          var acc = 0;
          var vstart = document.hidden ? null : Date.now();
          var total = function () {
            return acc + (vstart ? Date.now() - vstart : 0);
          };
          // UI-14: page/funnel telemetry. The React app reports the current tab via
          // gcSetTab and funnel steps (share card, copy link, subscribe click/done)
          // via gcEv. Counters live in sessionStorage so every flush carries the
          // session's cumulative totals — same last-write-wins shape as dwell.
          // Only whitelisted event names ever reach the payload (beacon.js enforces
          // its own whitelist too); no case detail or identity rides along here.
          var curTab = '';
          try { curTab = sessionStorage.getItem('gc_tab') || ''; } catch (e) {}
          window.gcSetTab = function (t) {
            curTab = String(t || '');
            try { sessionStorage.setItem('gc_tab', curTab); } catch (e) {}
          };
          var readEvents = function () {
            try { return JSON.parse(sessionStorage.getItem('gc_ev') || '{}') || {}; } catch (e) { return {}; }
          };
          window.gcEv = function (name) {
            try {
              var ev = readEvents();
              ev[name] = (ev[name] || 0) + 1;
              sessionStorage.setItem('gc_ev', JSON.stringify(ev));
              send();
            } catch (e) {}
          };
          var send = function () {
            var hasCase = false, subscribed = false, lang = '';
            // Anonymous case shape only — category/country/subtype (already treated as
            // shareable elsewhere, e.g. the deep-link URL) plus priorityDate. Deliberately
            // NOT birthYearMonth or name: those are quasi-identifying even without an
            // email attached, same reasoning as why birthYearMonth is kept out of the
            // shareable case URL (see writeUserCaseToURL in App.jsx).
            var category = '', country = '', priorityDate = '', subtype = '';
            try {
              var rawCase = localStorage.getItem('gc_userCase');
              hasCase = !!rawCase;
              subscribed = !!localStorage.getItem('gc_subscribedEmail');
              lang = (localStorage.getItem('gc_lang') || '').replace(/[^a-z]/g, '');
              if (rawCase) {
                var uc = JSON.parse(rawCase);
                category = uc.category || '';
                country = uc.country || '';
                priorityDate = uc.priorityDate || '';
                subtype = uc.subtype || '';
              }
            } catch (e) {}
            var payload = JSON.stringify({
              vid: vid, sid: sid, dwellMs: total(), lang: lang, hasCase: hasCase, subscribed: subscribed,
              category: category, country: country, priorityDate: priorityDate, subtype: subtype,
              tab: curTab, events: readEvents(),
            });
            if (navigator.sendBeacon) navigator.sendBeacon('/api/beacon', payload);
          };
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
              if (vstart) { acc += Date.now() - vstart; vstart = null; }
              send();
            } else if (!vstart) {
              vstart = Date.now();
            }
          });
          window.addEventListener('pagehide', send);
          // iOS Safari can kill a tab without firing pagehide — an early ping makes
          // sure the session is counted even then.
          setTimeout(send, 10000);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
